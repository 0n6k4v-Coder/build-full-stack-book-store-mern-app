server {
    listen 80;
    server_name _;

    # Root directory สำหรับ static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression — ลด payload size ของ JS/CSS ลงได้ ~70%
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Cache static assets ที่มี hash ใน filename (Vite จะ hash ไฟล์ให้อัตโนมัติ)
    # เช่น main-BxYzWqAb.js → cache ได้นาน 1 ปี (immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # สำคัญมากสำหรับ React Router (SPA)
    # ทุก path ที่ไม่ใช่ไฟล์จริง → ส่งกลับไปที่ index.html
    # เพื่อให้ client-side routing ของ react-router ทำงานได้
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ซ่อน nginx version จาก response headers (security)
    server_tokens off;
}
