# =============================================================================
# compose.yaml — MERN Book Store Stack
# Docker Compose Specification (no version field — deprecated since Compose V2)
#
# Services:
#   mongo     — MongoDB 8 database
#   backend   — Node.js / Express API
#   frontend  — React + Vite (served via nginx)
#
# Profiles:
#   tools     — mongo-express (DB GUI), รัน: docker compose --profile tools up
#
# Usage:
#   cp .env.example .env          # ตั้งค่า secrets
#   docker compose up -d          # รัน stack หลัก
#   docker compose --profile tools up -d  # รวม mongo-express ด้วย
#   docker compose down -v        # หยุดและลบ volumes
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MongoDB 8
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:8.0
    container_name: bookstore-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-bookstore}

    volumes:
      # Named volume สำหรับ data persistence (Docker-managed, ไม่หายเมื่อ container restart)
      - mongo_data:/data/db
      # Init scripts — รันเฉพาะครั้งแรกที่ volume ว่าง
      - ./mongo/init:/docker-entrypoint-initdb.d:ro

    # Health check ด้วย mongosh (mongo shell ถูกลบใน MongoDB 6+)
    # start_period เผื่อเวลา init script และ volume mount
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_ROOT_USERNAME}
        - --password
        - ${MONGO_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - backend_net

    # ไม่ expose port ออกนอก (มีแค่ backend ที่ต้องเข้าถึง)
    # uncomment ถ้าต้องการ connect จาก host โดยตรง:
    # ports:
    #   - "127.0.0.1:27017:27017"

  # ---------------------------------------------------------------------------
  # Backend — Node.js / Express API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # target: production  # uncomment เมื่อ backend Dockerfile มี multi-stage
    container_name: bookstore-backend
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-5000}
      # MongoDB connection string — ใช้ service name "mongo" เป็น hostname
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-bookstore}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}

    # รอ MongoDB healthy ก่อน start
    # depends_on: condition: service_healthy คือ best practice
    # (ไม่ใช่แค่ service_started ซึ่งไม่การันตีว่า DB พร้อม)
    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BACKEND_PORT:-5000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - backend_net
      - frontend_net

    # ไม่ expose โดยตรง — frontend เข้าผ่าน internal network
    # uncomment สำหรับ development / debugging:
    # ports:
    #   - "127.0.0.1:5000:5000"

  # ---------------------------------------------------------------------------
  # Frontend — React + Vite (built & served via nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Build args สำหรับ VITE_* env vars (baked ตอน build time)
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: bookstore-frontend
    restart: unless-stopped

    ports:
      # รับ traffic จาก host port 80 → nginx port 80 ใน container
      - "${FRONTEND_PORT:-80}:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - frontend_net

  # ---------------------------------------------------------------------------
  # Mongo Express — Web UI สำหรับ MongoDB (profile: tools)
  # รัน: docker compose --profile tools up -d
  # ---------------------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0
    container_name: bookstore-mongo-express
    restart: unless-stopped
    profiles:
      - tools

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: true
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}

    ports:
      # Bind เฉพาะ localhost — ห้าม expose ออก internet เด็ดขาด
      - "127.0.0.1:${ME_PORT:-8081}:8081"

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - backend_net

# =============================================================================
# Networks — แยก network ระหว่าง backend และ frontend
# frontend_net: frontend ↔ backend (API calls)
# backend_net:  backend ↔ mongo (DB connection, ไม่เปิดให้ frontend เข้า)
# =============================================================================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

# =============================================================================
# Volumes — Named volumes สำหรับ data persistence
# Docker-managed, ไม่หายเมื่อ container restart
# ลบทิ้งได้ด้วย: docker compose down -v
# =============================================================================
volumes:
  mongo_data:
    driver: local
